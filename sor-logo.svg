
:root{--navy:#061c36;--navy2:#092949;--gold:#c7922f;--gold2:#b57d24;--paper:#fbf8f1;--cream:#f6f1e8;--white:#fff;--text:#10213b;--muted:#5d6b7f;--line:#e7dfd2;--max:1180px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:Inter,Arial,Helvetica,sans-serif;color:var(--text);background:var(--paper);line-height:1.58}a{text-decoration:none;color:inherit}img{max-width:100%;display:block}.container{width:min(var(--max),calc(100% - 42px));margin:0 auto}.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 22px;border-radius:5px;font-weight:750;border:1px solid transparent;transition:.18s ease}.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;box-shadow:0 10px 28px rgba(98,62,16,.14)}.btn-dark{background:var(--navy);color:#fff}.btn-outline{border-color:var(--navy);color:var(--navy);background:transparent}h1,h2,h3,h4{font-family:Georgia,'Times New Roman',serif;line-height:1.06;letter-spacing:-.025em;color:var(--navy)}p{color:var(--muted)}.label{color:var(--gold2);text-transform:uppercase;letter-spacing:.08em;font-weight:800;font-size:.82rem;margin-bottom:13px}
.topbar{background:rgba(251,248,241,.96);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.nav{height:90px;display:flex;align-items:center;justify-content:space-between;gap:28px}.logo-img{height:52px;width:auto}.nav-links{display:flex;align-items:center;gap:26px;font-size:.95rem;color:var(--navy);font-weight:650}
.hero{position:relative;overflow:hidden;background:linear-gradient(90deg,var(--paper) 0%,var(--paper) 43%,rgba(251,248,241,.78) 49%,rgba(251,248,241,0) 58%),url('assets/hero-tomannsbolig-reisverk-norge.jpg') right center/58% 100% no-repeat}.hero .container{min-height:590px;display:flex;align-items:center}.hero-content{max-width:560px;padding:72px 0 90px}.hero h1{font-size:clamp(3rem,5.3vw,5rem);margin-bottom:26px}.hero h1 span{color:var(--gold)}.hero .lead{font-size:1.12rem;max-width:520px;color:#22354f;margin-bottom:28px}.micro{display:flex;gap:18px;align-items:center;margin-top:22px;color:#37516d;font-size:.92rem}.micro span:before{content:'◉';font-size:.75rem;color:#70879e;margin-right:8px}
.benefits{position:relative;margin-top:-50px;z-index:2}.benefit-grid{background:rgba(255,255,255,.94);border:1px solid var(--line);box-shadow:0 18px 40px rgba(16,33,59,.08);display:grid;grid-template-columns:repeat(4,1fr)}.benefit{padding:30px 24px;text-align:center;border-right:1px solid var(--line)}.benefit:last-child{border-right:none}.icon{width:46px;height:46px;border:2px solid #254665;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;color:var(--navy);font-weight:900}.benefit h3,.card h3{font-family:Georgia,'Times New Roman',serif;font-size:1.25rem;margin-bottom:8px;color:var(--navy)}.benefit p,.card p{font-size:.95rem}
.section{padding:74px 0}.section-head{max-width:790px;margin-bottom:30px}.section-head h2{font-size:clamp(2rem,3.2vw,3rem);margin-bottom:12px}.section-title{font-size:2.1rem;margin-bottom:26px;position:relative}.section-title:after{content:'';display:block;width:42px;height:3px;background:var(--gold);margin-top:10px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:22px}.card{background:#fff;border:1px solid var(--line);padding:28px 22px;min-height:230px;display:flex;flex-direction:column;justify-content:space-between}.card .card-icon{font-size:2rem;color:var(--navy);margin-bottom:12px}.card a{color:var(--gold2);font-weight:800;margin-top:18px;display:inline-block}.soft{background:#fffaf2}
.process{display:grid;grid-template-columns:1fr 1fr 1fr;gap:36px;align-items:start}.step{display:grid;grid-template-columns:56px 1fr;gap:18px;align-items:start}.num{width:50px;height:50px;background:var(--navy);color:#fff;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;font-weight:850}.step h3{font-family:Georgia,'Times New Roman',serif;color:var(--navy);font-size:1.35rem;margin-bottom:6px}.experience{display:grid;grid-template-columns:.75fr 1.25fr;gap:40px;align-items:start}.case-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.case{background:#fff;border:1px solid var(--line)}.case img{height:130px;width:100%;object-fit:cover}.case div{padding:16px}.case h3{font-size:1.05rem;margin-bottom:6px}.profile{display:grid;grid-template-columns:.75fr .7fr 1fr;gap:42px;align-items:center}.profile-img{border-radius:8px;background:#dfe5e8;width:100%;max-height:280px;object-fit:cover}.checklist{display:grid;gap:14px}.check{display:flex;align-items:flex-start;gap:12px;color:#243851}.check:before{content:'✓';width:22px;height:22px;border:1.5px solid #244665;border-radius:50%;display:grid;place-items:center;font-size:.8rem;color:#244665;flex:0 0 22px;margin-top:2px}.faq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.cta{background:var(--navy);color:#fff;padding:56px 0;background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.06),transparent 28%),linear-gradient(135deg,var(--navy),#082947)}.cta-grid{display:grid;grid-template-columns:1fr auto;gap:36px;align-items:center}.cta h2{color:#fff;font-size:2.3rem;margin-bottom:8px}.cta p{color:rgba(255,255,255,.78)}
.footer{background:#fff;padding:42px 0 18px;border-top:1px solid var(--line)}.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px;align-items:start}.footer-logo{height:46px;width:auto;margin-bottom:18px}.footer h4{font-family:Inter,Arial,sans-serif;color:var(--navy);font-size:1rem;margin-bottom:10px}.footer ul{list-style:none;display:grid;gap:8px;color:#58677a;font-size:.95rem}.bottom{border-top:1px solid var(--line);margin-top:28px;padding-top:14px;display:flex;justify-content:space-between;color:#7a8491;font-size:.88rem}.page-hero{background:linear-gradient(135deg,var(--navy),#082947);padding:82px 0;color:#fff}.page-hero h1{color:#fff;font-size:clamp(2.7rem,5vw,4.4rem);margin-bottom:14px}.page-hero p{color:rgba(255,255,255,.82);font-size:1.15rem;max-width:820px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line)}table{border-collapse:collapse;width:100%;min-width:900px}th,td{text-align:left;vertical-align:top;padding:15px;border-bottom:1px solid var(--line)}th{background:#f2ebdf;color:var(--navy)}td{color:#33445a}
@media(max-width:980px){.nav{height:auto;padding:18px 0;align-items:flex-start}.nav,.nav-links{flex-wrap:wrap}.nav-links{gap:14px}.hero{background:linear-gradient(180deg,rgba(251,248,241,.9),rgba(251,248,241,.95)),url('assets/hero-tomannsbolig-reisverk-norge.jpg') center/cover no-repeat}.hero .container{min-height:auto}.benefit-grid,.cards,.process,.experience,.case-grid,.profile,.cta-grid,.footer-grid,.faq-grid{grid-template-columns:1fr}.benefit{border-right:none;border-bottom:1px solid var(--line)}.benefit:last-child{border-bottom:none}}
